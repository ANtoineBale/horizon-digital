<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Studio Balesi</title>
  <meta name="description" content="Cette page n'existe pas ou a été déplacée.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0A0D1F">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="preload" href="/assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20261120z">
  <link rel="stylesheet" href="/assets/css/components.css?v=20261120z">
  <link rel="stylesheet" href="/assets/css/pages/inner.css?v=20261120z">
  <link rel="stylesheet" href="/assets/css/theme-nuit.css?v=20261120z" id="theme-nuit">
  <link rel="stylesheet" href="/assets/css/theme-clair.css?v=20261120z">
  <script src="/assets/js/theme.js?v=20261120z"></script>

  <!-- Chemins absolus en / : la 404 s'affiche à n'importe quelle
       adresse du site, puisque studiobalesi.fr sert le site à la racine. -->
  <style>
    /* Page autonome : le décor tient tout l'écran */
    .lost {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      background: var(--nuit);
      position: relative;
      overflow: hidden;
      padding: var(--gutter);
    }
    /* Le décor est en z-index -1 dans inner.css : ici il passerait derrière
       le fond de .lost. On le remonte au-dessus du fond, sous le contenu. */
    .lost .page-hero__decor { z-index: 0; }
    .lost__inner { position: relative; z-index: 1; max-width: 620px; }
    .lost .lost__code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 11rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--ciel);
      margin-bottom: 1.5rem;
    }
    .lost h1 { font-size: clamp(1.75rem, 4vw, 2.75rem); color: var(--on-dark); margin-bottom: 1rem; }
    .lost p { color: var(--on-dark-muted); margin-bottom: 2.5rem; }
    .lost__actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    @media (max-width: 540px) { .lost__actions .btn { width: 100%; } }
  </style>
</head>
<body>

<main class="lost is-dark">
  <div class="page-hero__decor" aria-hidden="true"></div>

  <div class="lost__inner">
    <p class="lost__code" aria-hidden="true">404</p>
    <h1>Cette page est hors de l'horizon.</h1>
    <p>
      Le lien est peut-être obsolète, ou l'adresse comporte une erreur.
      Rien n'est perdu&nbsp;: tout le site reste accessible depuis l'accueil.
    </p>
    <div class="lost__actions">
      <a href="/" class="btn btn--primary">Retour à l'accueil <span class="btn__arrow" aria-hidden="true">→</span></a>
      <a href="/contact.html" class="btn btn--ghost">Parlons de votre projet</a>
    </div>
  </div>
</main>

</body>
</html>
