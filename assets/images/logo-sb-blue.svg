<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none" role="img" aria-label="Studio Balesi">
  <!-- Monogramme SB en Inter Tight, bleu Royal Marine -->
  <text x="0" y="40" font-family="'Inter Tight', 'Inter', system-ui, sans-serif" font-size="44" font-weight="500" fill="#2A4FAE" letter-spacing="-1.5">S</text>
  <text x="26" y="40" font-family="'Inter Tight', 'Inter', system-ui, sans-serif" font-size="44" font-weight="500" font-style="italic" fill="#2A4FAE" letter-spacing="-1.5">B</text>
  <!-- Trait vertical séparateur -->
  <line x1="62" y1="14" x2="62" y2="40" stroke="#2A4FAE" stroke-width="1" stroke-linecap="square"/>
  <!-- Nom complet en Inter, encre -->
  <text x="72" y="22" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#1B1B18">STUDIO</text>
  <text x="72" y="36" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#1B1B18">BALESI</text>
</svg>
